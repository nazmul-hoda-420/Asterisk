<div class="mb-5">
    <h1 class="text-sm font-semibold text-gray-800">CRM</h1>
    <p class="text-[11px] text-gray-500 mt-0.5">Log a customer or lead</p>
</div>

<form method="post" action="{% url 'user_dashboard' %}" class="bg-white rounded-md border border-slate-200 shadow-sm p-4 sm:p-5">
    {% csrf_token %}
    <input type="hidden" name="form" value="crm">
    <input type="hidden" name="action" value="save">
    <h3 class="text-[11px] font-bold text-indigo-600 uppercase tracking-widest mb-3 flex items-center gap-1.5">
        <i class="fas fa-user-plus text-[10px]"></i> Add Contact
    </h3>
    <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4">
        <div>
            <label for="{{ form.name.id_for_label }}" class="block text-[11px] font-semibold text-slate-600 mb-1">Name</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-user text-gray-400 text-sm"></i>
                </div>
                {{ form.name }}
            </div>
            {% if form.name.errors %}<p class="text-red-500 text-[10px] mt-1">{{ form.name.errors.0 }}</p>{% endif %}
        </div>
        <div>
            <label for="{{ form.phone.id_for_label }}" class="block text-[11px] font-semibold text-slate-600 mb-1">Phone</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-phone text-gray-400 text-sm"></i>
                </div>
                {{ form.phone }}
            </div>
            {% if form.phone.errors %}<p class="text-red-500 text-[10px] mt-1">{{ form.phone.errors.0 }}</p>{% endif %}
        </div>
        <div>
            <label for="{{ form.email.id_for_label }}" class="block text-[11px] font-semibold text-slate-600 mb-1">Email</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-envelope text-gray-400 text-sm"></i>
                </div>
                {{ form.email }}
            </div>
        </div>
        <div>
            <label for="{{ form.tag.id_for_label }}" class="block text-[11px] font-semibold text-slate-600 mb-1">Tag</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-tag text-gray-400 text-sm"></i>
                </div>
                {{ form.tag }}
                <i class="fas fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-[10px] pointer-events-none"></i>
            </div>
        </div>
        <div>
            <label for="{{ form.follow_up_date.id_for_label }}" class="block text-[11px] font-semibold text-slate-600 mb-1">Follow-up Date</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-calendar-days text-gray-400 text-sm"></i>
                </div>
                {{ form.follow_up_date }}
            </div>
        </div>
        <div class="md:col-span-3 lg:col-span-5">
            <label for="{{ form.notes.id_for_label }}" class="block text-[11px] font-semibold text-slate-600 mb-1">Notes</label>
            {{ form.notes }}
        </div>
    </div>
    <div class="flex justify-end mt-4">
        <button type="submit" class="px-5 py-1.5 bg-indigo-600 text-white text-[11px] font-bold rounded-sm hover:bg-indigo-700">Save Contact</button>
    </div>
</form>
